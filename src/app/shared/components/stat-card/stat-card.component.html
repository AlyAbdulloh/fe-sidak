<div class="card border-0 shadow-sm rounded-4 h-100 stat-card">
  <div class="card-body p-4 d-flex flex-column justify-content-between">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h6 class="text-uppercase text-muted fw-bold text-xs mb-1">{{ title }}</h6>
        <h2 class="fw-extrabold mb-0 text-dark font-display">{{ value }}</h2>
      </div>
      <div class="stat-icon-wrapper rounded-3 d-flex align-items-center justify-content-center {{ iconBgClass }}">
        <i class="bi {{ icon }} fs-3"></i>
      </div>
    </div>

    @if (changeText || description) {
      <div class="d-flex align-items-center gap-2 pt-2 border-top border-light-subtle text-xs">
        @if (changeText) {
          <span class="badge rounded-pill d-flex align-items-center gap-1"
                [class.bg-success-subtle]="isPositiveChange"
                [class.text-success]="isPositiveChange"
                [class.bg-danger-subtle]="!isPositiveChange"
                [class.text-danger]="!isPositiveChange">
            <i class="bi" [class.bi-arrow-up-short]="isPositiveChange" [class.bi-arrow-down-short]="!isPositiveChange"></i>
            {{ changeText }}
          </span>
        }
        @if (description) {
          <span class="text-muted text-truncate">{{ description }}</span>
        }
      </div>
    }
  </div>
</div>
